name: Convertios newsroom source checks (local Codex generation)
on:
  schedule:
    - cron: '17 8 * * 1,4' # Monday and Thursday, 08:17 UTC (11:17 in Jordan)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: convertios-newsroom-source-checks
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production site (read-only)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Collect official source candidates
        run: |
          set -euo pipefail
          python scripts/newsroom.py collect --today "$(date -u +%F)"
          python -c 'import json; d=json.load(open("newsroom-intake.json")); print("Eligible official pages:", len(d["sources"]), "Feed failures:", len(d["failures"]))'
      - name: Retain read-only research evidence
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-source-snapshot
          path: newsroom-intake.json
          if-no-files-found: error
          retention-days: 2
