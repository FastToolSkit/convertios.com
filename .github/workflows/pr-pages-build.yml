name: PR Pages Build Verification

on:
  push:
    branches:
      - fix/indexing-recovery-20261112
  pull_request:
    paths:
      - '**/*.html'
      - '_config.yml'
      - '.github/workflows/pr-pages-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-pages-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Validate static site and homepage navigation geometry
        run: node tests/site-check.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build with official GitHub Pages Jekyll action
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check expected publication files
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/contact/index.html
          test -s _site/es/contact/index.html
          test -s _site/ar/contact/index.html
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          test ! -e _site/server.js
          test ! -e _site/tests
          test ! -e _site/docs
          echo 'Pages candidate build and publication exclusions passed'
      - name: Verify deterministic stamps and published asset bytes
        shell: bash
        run: |
          python tests/stamp-assets.test.py
          python scripts/stamp-assets.py --check
          python - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          root = Path('_site')
          references = 0
          pattern = re.compile(rb'(?:href|src)="(/[A-Za-z0-9_./-]+\.(?:css|js))\?v=([a-f0-9]+)"')
          for page in root.rglob('*.html'):
              for match in pattern.finditer(page.read_bytes()):
                  asset = root / match[1].decode().lstrip('/')
                  digest = hashlib.sha256(asset.read_bytes()).hexdigest()[:8]
                  assert digest == match[2].decode(), (str(page), str(asset), digest)
                  references += 1
          assert references > 0, 'No published asset references checked'
          print(f'{references} published references match actual asset bytes')
          PY
